name: Bug report
description: Report a reproducible pipeline failure
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the failing command and the complete traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the redacted output of `amazon-er doctor`; never include tokens or credentials.
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Configuration and commit
    validations:
      required: true
