[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-ml-entity-resolution"
version = "0.1.0"
description = "Multilingual, graph-aware business entity resolution with exact macro-F0.5 decoding"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Business Entity Resolution contributors"}]
keywords = ["entity-resolution", "record-linkage", "multilingual", "lightgbm", "reranking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anyascii>=0.3.2,<0.4",
  "joblib>=1.4,<2",
  "lightgbm>=4.5,<5",
  "numba>=0.60,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "polars>=1.9,<2",
  "psutil>=6,<8",
  "pyarrow>=17,<22",
  "PyYAML>=6,<7",
  "RapidFuzz>=3.10,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dense = [
  "faiss-cpu>=1.9,<2",
  "sentence-transformers>=3.2,<6",
]
gpu = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1; platform_system == 'Linux'",
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "sentence-transformers>=3.2,<6",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
amazon-er = "amazon_er.cli:main"

[project.urls]
Repository = "https://github.com/your-org/amazon-ml-entity-resolution"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tools/validate_submission.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702", "E741"]
